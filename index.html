<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NHR RUN 러너 테스트</title>
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
<header class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="뒤로 가기"><svg viewBox="0 0 69 69" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="68.9" height="68.9" rx="34.4" fill="#574398"/><path d="M31.9 48.0L20 34.0L31.9 20M20 34.0H49.3" stroke="#EEEBD7" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="logo" id="logoBtn" aria-label="NHR RUN 처음으로"><svg viewBox="0 0 200 63" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.1 4.1L3.9 10.0L0 37.0L4.1 54.9L24.9 62.5L43.3 58.5L58.9 57.2L69.8 60.7L101.7 57.0L125.4 61.3L134.8 57.3L156.8 56.0L168.1 61.6L194.1 56.0L199.3 34.9L194.5 5.8L180.4 2.4L155.9 4.6L126.8 0.6L97.5 4.0L64.9 0L39.3 4.0L19.1 4.1Z" fill="#574398"/><path d="M14.6 44.6L13.5 18.9L20.9 16.3L33.7 32.6L33.6 16.1L40.5 14.2V44.4L34.2 45.8L20.5 28.4L22.0 47.5L14.6 44.6Z" fill="white"/><path d="M68.3 15.3L68.8 47.1L60.5 45.7L62.0 33.6H48.8L50.9 45.8L43.0 47.1L42.2 15.9L50.1 14.5L48.7 27.7L61.5 26.1L60.5 14.5L68.3 15.3L68.3 15.3Z" fill="white"/><path d="M88.8 33.8L96.6 46.3H88.8L82.5 34.7L77.9 34.9L78.8 46.9H70.8L71.5 14.6L94.5 16.7V33.8H88.8V33.8ZM88.7 21.9L77.9 20.7V28.0H88.7V21.9Z" fill="white"/><path d="M121.8 33.8L129.6 46.3H121.8L115.5 34.7L110.9 34.9L111.8 46.9H103.9L104.6 14.6L127.5 16.7V33.8H121.8V33.8ZM121.7 21.9L110.9 20.7V28.0H121.7V21.9Z" fill="white"/><path d="M150.3 15.3H156.4L155.3 45.8L130.6 45.4L131.9 15.1H138.2L138.5 38.7L148.5 39.4L150.3 15.3Z" fill="white"/><path d="M159.4 44.6L158.3 18.9L165.7 16.3L178.5 32.6L178.4 16.1L185.2 14.2V44.4L179.0 45.8L165.3 28.4L166.8 47.5L159.4 44.6Z" fill="white"/></svg></button>
</header>

<main id="app">
  <section class="screen start" id="s-start">
    <span class="sparkle" style="left:239px;top:209px;width:50px"></span>
    <span class="sparkle" style="left:1265px;top:435px;width:50px;animation-duration:20s"></span>
    <span class="sparkle" style="left:104px;top:500px;width:31px;animation-duration:12s"></span>
    <span class="sparkle" style="left:325px;top:236px;width:34px;animation-direction:reverse"></span>
    <h1 class="title-xl"><img class="vt" src="assets/text/title.svg" alt="올해 나는 어떤 러너였을까?"></h1>
    <button class="cta" id="goReg"><img class="vt" src="assets/text/cta.svg" alt="러너 카드 발급하러 가기"></button>
    <div class="collage" id="collage"></div>
  </section>

  <section class="screen" id="s-reg" hidden>
    <div class="card" id="regForm">
      <div style="display:flex;flex-direction:column;gap:24px">
        <div class="reg-head">
          <h2><img class="vt" src="assets/text/reg.svg" alt="달리기 전에, 러너 등록부터!"></h2>
          <p>올해 달려온 코스를 돌아보고, 나의 러너 유형을 확인해 보세요.</p>
        </div>
        <div class="fields">
          <div class="field"><label for="runnerName">이름</label><input id="runnerName" name="runnerName" autocomplete="name" placeholder="이름을 입력해 주세요" maxlength="20"></div>
          <div class="field"><label for="runnerTeam">소속 팀</label><input id="runnerTeam" name="runnerTeam" placeholder="예: HR마케팅2팀" maxlength="30"></div>
        </div>
        <div class="notice">
          <div style="display:flex;flex-direction:column;gap:7px">
            <strong>참여 기록 수집 안내</strong>
            <p>이름·팀·러너 유형·등록 및 완료 시각은 참가자 확인과 행사 운영에 사용합니다.<br>명단은 운영자만 열람합니다.</p>
          </div>
          <label class="check"><input type="checkbox" id="agree"> 참여 기록 수집에 동의합니다.</label>
        </div>
      </div>
      <div class="reg-actions">
        <button class="btn" id="startQuiz" type="button">출발하기</button>
        <p class="reg-msg" id="regMsg" role="alert" hidden></p>
        <button type="button" class="textlink" data-act="home">← 처음부터</button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <span class="sparkle" style="left:130px;top:493px;width:50px"></span>
    <span class="sparkle" style="left:1136px;top:654px;width:50px;animation-direction:reverse"></span>
    <span class="sparkle" style="left:1350px;top:558px;width:32px;animation-duration:11s"></span>
    <div class="card">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" id="prog"><i></i></div>
      <div class="q-body" id="qBody"><h2 class="q-title" id="qTitle"></h2><ul class="options" id="qOpts"></ul></div>
      <button type="button" class="textlink" id="qBack"></button>
    </div>
    <div class="peek" id="qMascot"></div>
  </section>

  <section class="screen" id="s-result" hidden><div class="result" id="result"></div></section>
</main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="러너 카드">
    <img id="cardImg" alt="나의 러너 카드">
    <p id="cardTip">카드를 길게 누르거나 마우스 오른쪽 버튼을 눌러 이미지로 저장하세요.</p>
    <button class="btn" id="dlBtn">이미지 다운로드</button>
    <button class="textlink" id="closeModal" style="align-self:center">닫기</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
